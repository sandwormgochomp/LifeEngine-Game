<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="'Courier New',monospace" shape-rendering="crispEdges">
  <defs>
    <radialGradient id="flash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEA00"/>
      <stop offset="35%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="880" height="540" fill="#0E1318"/>
  <g shape-rendering="auto">
    <text x="28" y="46" fill="#FF6B00" font-size="26" font-weight="bold" letter-spacing="3">07 · WORLD EVENTS</text>
    <text x="28" y="70" fill="#5f7183" font-size="13" letter-spacing="1">punctuate the equilibrium — disruption, struggle, recovery, on demand</text>
  </g>
  <line x1="28" y1="84" x2="852" y2="84" stroke="#1c2630" stroke-width="2"/>

  <!-- HERO SCENE : meteor impact -->
  <rect x="28" y="100" width="520" height="300" fill="#0b0f13" stroke="#1c2630"/>
  <clipPath id="scene"><rect x="28" y="100" width="520" height="300"/></clipPath>
  <g clip-path="url(#scene)">
    <!-- scattered producers before impact (top area) -->
    <g>
      <rect x="70" y="140" width="12" height="12" fill="#15DE59"/><rect x="82" y="140" width="12" height="12" fill="#15DE59"/><rect x="70" y="152" width="12" height="12" fill="#DEB14D"/>
      <rect x="150" y="130" width="12" height="12" fill="#15DE59"/><rect x="162" y="130" width="12" height="12" fill="#DEB14D"/>
      <rect x="110" y="200" width="12" height="12" fill="#15DE59"/><rect x="122" y="200" width="12" height="12" fill="#15DE59"/>
    </g>
    <!-- meteor streak -->
    <g shape-rendering="auto">
      <line x1="70" y1="110" x2="360" y2="300" stroke="#FF6B00" stroke-width="4" opacity="0.5"/>
      <line x1="120" y1="120" x2="360" y2="300" stroke="#FFEA00" stroke-width="2" opacity="0.7"/>
    </g>
    <rect x="352" y="290" width="18" height="18" fill="#FFEA00"/>
    <!-- impact flash -->
    <circle cx="380" cy="330" r="110" fill="url(#flash)" opacity="0.9" shape-rendering="auto"/>
    <!-- crater: killed swathe + scattered food -->
    <g fill="#34593C">
      <rect x="330" y="330" width="8" height="8"/><rect x="360" y="350" width="8" height="8"/><rect x="400" y="330" width="8" height="8"/><rect x="420" y="360" width="8" height="8"/><rect x="350" y="378" width="8" height="8"/><rect x="404" y="384" width="8" height="8"/><rect x="380" y="356" width="8" height="8"/><rect x="440" y="340" width="8" height="8"/>
    </g>
    <!-- ash cells -->
    <g fill="#2a3540">
      <rect x="344" y="344" width="12" height="12"/><rect x="392" y="360" width="12" height="12"/><rect x="368" y="380" width="12" height="12"/><rect x="416" y="330" width="12" height="12"/>
    </g>
    <!-- a survivor at the rim, about to recolonise -->
    <rect x="470" y="200" width="14" height="14" fill="#15DE59"/><rect x="484" y="200" width="14" height="14" fill="#DEB14D"/><rect x="470" y="214" width="14" height="14" fill="#15DE59"/>
  </g>
  <!-- narrator toast overlay -->
  <g shape-rendering="auto" font-family="'Courier New',monospace">
    <rect x="300" y="112" width="236" height="40" rx="4" fill="#1a1008" stroke="#FF6B00" opacity="0.95"/>
    <text x="316" y="130" fill="#FF6B00" font-size="12" font-weight="bold">☄ METEOR STRIKE</text>
    <text x="316" y="146" fill="#c98a55" font-size="11">mass extinction · −52% population</text>
  </g>
  <g shape-rendering="auto"><text x="288" y="392" fill="#5f7183" font-size="11" text-anchor="middle">kill swathe + food scatter → boom-time recolonisation</text></g>

  <!-- EVENT LIBRARY (right column) -->
  <g shape-rendering="auto"><text x="572" y="120" fill="#8fa0b0" font-size="14" font-weight="bold" letter-spacing="2">EVENT LIBRARY</text></g>

  <!-- Meteor -->
  <g shape-rendering="auto" font-family="'Courier New',monospace">
    <rect x="572" y="132" width="280" height="44" rx="4" fill="#12181e" stroke="#243441"/>
    <circle cx="596" cy="154" r="9" fill="#FF6B00"/>
    <text x="614" y="150" fill="#FF6B00" font-size="12" font-weight="bold">METEOR</text>
    <text x="614" y="166" fill="#5f7183" font-size="10">kill + scatter · mass extinction toast</text>
  </g>
  <!-- Bloom -->
  <g shape-rendering="auto" font-family="'Courier New',monospace">
    <rect x="572" y="182" width="280" height="44" rx="4" fill="#12181e" stroke="#243441"/>
    <circle cx="596" cy="204" r="9" fill="#15DE59"/>
    <text x="614" y="200" fill="#15DE59" font-size="12" font-weight="bold">BLOOM</text>
    <text x="614" y="216" fill="#5f7183" font-size="10">foodProdProb spike · pop explosion</text>
  </g>
  <!-- Ice age -->
  <g shape-rendering="auto" font-family="'Courier New',monospace">
    <rect x="572" y="232" width="280" height="44" rx="4" fill="#12181e" stroke="#243441"/>
    <circle cx="596" cy="254" r="9" fill="#60D4FF"/>
    <text x="614" y="250" fill="#60D4FF" font-size="12" font-weight="bold">ICE AGE / DROUGHT</text>
    <text x="614" y="266" fill="#5f7183" font-size="10">food crash · culls the inefficient</text>
  </g>
  <!-- Radiation storm -->
  <g shape-rendering="auto" font-family="'Courier New',monospace">
    <rect x="572" y="282" width="280" height="44" rx="4" fill="#12181e" stroke="#243441"/>
    <circle cx="596" cy="304" r="9" fill="#C2FF00"/>
    <text x="614" y="300" fill="#C2FF00" font-size="12" font-weight="bold">RADIATION STORM</text>
    <text x="614" y="316" fill="#5f7183" font-size="10">moving front · evolution runs hot</text>
  </g>
  <!-- Invasive predator -->
  <g shape-rendering="auto" font-family="'Courier New',monospace">
    <rect x="572" y="332" width="280" height="52" rx="4" fill="#1a0d14" stroke="#F82380"/>
    <circle cx="596" cy="358" r="9" fill="#F82380"/>
    <text x="614" y="352" fill="#F82380" font-size="12" font-weight="bold">INVASIVE PREDATOR ★</text>
    <text x="614" y="368" fill="#c96189" font-size="10">drop a pre-evolved hunter into</text>
    <text x="614" y="380" fill="#c96189" font-size="10">settled prey · watch the arms race</text>
  </g>

  <!-- controls hint -->
  <line x1="28" y1="424" x2="852" y2="424" stroke="#1c2630" stroke-width="2"/>
  <g shape-rendering="auto" font-family="'Courier New',monospace">
    <text x="28" y="452" fill="#8fa0b0" font-size="13" font-weight="bold" letter-spacing="1">TRIGGER</text>
    <!-- manual -->
    <rect x="28" y="464" width="230" height="40" rx="4" fill="#12181e" stroke="#243441"/>
    <text x="44" y="482" fill="#B6C1EA" font-size="12">▸ Cataclysm brush</text>
    <text x="44" y="497" fill="#5f7183" font-size="10">manual — a verb players want</text>
    <!-- auto -->
    <rect x="276" y="464" width="300" height="40" rx="4" fill="#12181e" stroke="#243441"/>
    <text x="292" y="482" fill="#B6C1EA" font-size="12">▸ Random events</text>
    <text x="292" y="497" fill="#5f7183" font-size="10">toggle + frequency slider · default low/off</text>
  </g>
  <g shape-rendering="auto"><text x="600" y="490" fill="#5f7183" font-size="11">each event announced via Narrator ·<tspan x="600" dy="15">focus follow-a-lineage on the survivor</tspan></text></g>
</svg>
