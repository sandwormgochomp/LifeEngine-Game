<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="'Courier New',monospace" shape-rendering="crispEdges">
  <rect width="880" height="540" fill="#0E1318"/>
  <g shape-rendering="auto">
    <text x="28" y="46" fill="#DEB14D" font-size="26" font-weight="bold" letter-spacing="3">05 · HUD INFORMATION DIET</text>
    <text x="28" y="70" fill="#5f7183" font-size="13" letter-spacing="1">cull duplicated counters, spend the space on what's actually happening to life</text>
  </g>
  <line x1="28" y1="84" x2="852" y2="84" stroke="#1c2630" stroke-width="2"/>

  <!-- BEFORE -->
  <g shape-rendering="auto"><text x="28" y="120" fill="#F82380" font-size="15" font-weight="bold" letter-spacing="2">BEFORE · four ambiguous tiles</text></g>
  <!-- mock world strip behind hud -->
  <rect x="28" y="132" width="824" height="96" fill="#0b0f13" stroke="#1c2630"/>
  <!-- top center cluster of tiles -->
  <g shape-rendering="auto" font-family="'Courier New',monospace">
    <!-- GEN -->
    <rect x="120" y="152" width="150" height="56" fill="#12181e" stroke="#243441"/>
    <text x="195" y="176" fill="#8fa0b0" font-size="12" text-anchor="middle" letter-spacing="2">GEN</text>
    <text x="195" y="198" fill="#B6C1EA" font-size="18" text-anchor="middle" font-weight="bold">14 820</text>
    <!-- POP -->
    <rect x="278" y="152" width="150" height="56" fill="#12181e" stroke="#243441"/>
    <text x="353" y="176" fill="#8fa0b0" font-size="12" text-anchor="middle" letter-spacing="2">POP</text>
    <text x="353" y="198" fill="#B6C1EA" font-size="18" text-anchor="middle" font-weight="bold">1 342</text>
    <!-- LIFEFORMS (button-that-looks-inert) -->
    <rect x="436" y="152" width="150" height="56" fill="#12181e" stroke="#243441"/>
    <text x="511" y="176" fill="#8fa0b0" font-size="12" text-anchor="middle" letter-spacing="2">LIFEFORMS</text>
    <text x="511" y="198" fill="#B6C1EA" font-size="18" text-anchor="middle" font-weight="bold">23</text>
    <!-- SPECIES (same number, other label) -->
    <rect x="594" y="152" width="150" height="56" fill="#12181e" stroke="#243441"/>
    <text x="669" y="176" fill="#8fa0b0" font-size="12" text-anchor="middle" letter-spacing="2">SPECIES</text>
    <text x="669" y="198" fill="#B6C1EA" font-size="18" text-anchor="middle" font-weight="bold">23</text>
  </g>
  <!-- annotations -->
  <g shape-rendering="auto" font-family="'Courier New',monospace" font-size="11">
    <text x="195" y="248" fill="#F82380" text-anchor="middle">not a generation</text>
    <text x="195" y="262" fill="#5f7183" text-anchor="middle">= total_ticks</text>
    <text x="590" y="248" fill="#F82380" text-anchor="middle">same number, two labels</text>
    <path d="M511 210 L511 240" stroke="#F82380" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M669 210 L669 240" stroke="#F82380" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="511" y="278" fill="#F82380" text-anchor="middle">button dressed as a readout</text>
  </g>

  <line x1="28" y1="300" x2="852" y2="300" stroke="#1c2630" stroke-width="2"/>

  <!-- AFTER -->
  <g shape-rendering="auto"><text x="28" y="336" fill="#15DE59" font-size="15" font-weight="bold" letter-spacing="2">AFTER · one meaning line, counters demoted</text></g>
  <rect x="28" y="348" width="824" height="120" fill="#0b0f13" stroke="#1c2630"/>

  <!-- promoted meaning line -->
  <g shape-rendering="auto" font-family="'Courier New',monospace">
    <rect x="120" y="366" width="640" height="52" rx="4" fill="#101a14" stroke="#1d3a28"/>
    <circle cx="150" cy="392" r="8" fill="#15DE59"/>
    <text x="172" y="388" fill="#8fa0b0" font-size="11" letter-spacing="1">DOMINANT LINEAGE</text>
    <text x="172" y="408" fill="#15DE59" font-size="18" font-weight="bold">Glowgrazer</text>
    <text x="360" y="408" fill="#60D4FF" font-size="16" font-weight="bold">▲ rising</text>
    <text x="470" y="408" fill="#5f7183" font-size="13">· 41% of pop · +6%/window</text>
  </g>
  <g shape-rendering="auto"><text x="440" y="440" fill="#5f7183" font-size="10" text-anchor="middle">— driven by the data the Narrator already diffs each window —</text></g>

  <!-- demoted quiet counter row -->
  <g shape-rendering="auto" font-family="'Courier New',monospace" font-size="12">
    <text x="120" y="458" fill="#4a5865">TICKS 14 820</text>
    <text x="260" y="458" fill="#4a5865">·</text>
    <text x="290" y="458" fill="#4a5865">POP 1 342</text>
    <text x="410" y="458" fill="#4a5865">·</text>
    <text x="440" y="458" fill="#5f7183">SPECIES 23 ▸</text>
    <text x="600" y="458" fill="#3a4a58">(one word · one prominent story)</text>
  </g>

  <line x1="28" y1="492" x2="852" y2="492" stroke="#1c2630" stroke-width="2"/>
  <g shape-rendering="auto"><text x="28" y="516" fill="#5f7183" font-size="11">closes TODO groups 2–3 · GEN→TICKS · collapse LIFEFORMS/SPECIES · make the clickable stat look clickable</text></g>
</svg>
